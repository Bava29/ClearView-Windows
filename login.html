<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClearView Windows</title>
    <meta name="description" content="Sign in to your ClearView Windows client account.">

    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body">

    <!-- Top-right Theme Controls -->
    <div class="auth-top-controls">
        <button type="button" class="auth-mode-btn" id="authThemeToggle" aria-label="Enable dark mode"
            aria-pressed="false">
            <i class="fa-solid fa-moon"></i>
        </button>

        <button type="button" class="auth-mode-btn" id="authRtlToggle" aria-label="Enable RTL mode"
            aria-pressed="false">
            <i class="fa-solid fa-right-left"></i>
        </button>
    </div>

    <main class="auth-page">
        <section class="auth-card" aria-labelledby="authTitle">

            <a href="index.html" class="auth-logo">
                <img src="images/logo.png" alt="ClearView Windows">
            </a>

            <div class="auth-heading">
                <h1 id="authTitle">Welcome Back!</h1>
                <p>Sign in to manage your window installation project.</p>
            </div>

            <form id="loginForm" class="auth-form">

                <div class="auth-field">
                    <label for="loginEmail">Email Address</label>
                    <div class="auth-input-wrap">
                        <i class="fa-regular fa-envelope auth-field-icon"></i>
                        <input type="email" id="loginEmail" name="email" placeholder="Enter your email address"
                            autocomplete="email" required>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="loginPassword">Password</label>
                    <div class="auth-input-wrap">
                        <i class="fa-solid fa-lock auth-field-icon"></i>
                        <input type="password" id="loginPassword" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>

                        <button type="button" class="auth-eye-btn" data-password-target="loginPassword"
                            aria-label="Show password" aria-pressed="false">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-form-options">
                    <label class="auth-remember">
                        <input type="checkbox" name="remember" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="auth-text-link">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="auth-submit-btn">
                    Login <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="auth-divider">
                    <span>Or continue with</span>
                </div>


                <div class="auth-socials">
                    <button type="button" class="auth-social-btn">
                        <!-- Google SVG icon -->
                        <svg class="auth-google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
                            aria-hidden="true">
                            <path fill="#4285F4"
                                d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z" />
                            <path fill="#34A853"
                                d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z" />
                            <path fill="#FBBC05"
                                d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z" />
                            <path fill="#EA4335"
                                d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8A19.5 19.5 0 0 0 24 4 20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z" />
                        </svg>

                        Google
                    </button>

                    <button type="button" class="auth-social-btn">
                        <i class="fa-brands fa-facebook auth-facebook-icon"></i>
                        Facebook
                    </button>

                    <button type="button" class="auth-social-btn">
                        <i class="fa-brands fa-apple auth-apple-icon"></i>
                        Apple
                    </button>
                </div>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html" class="auth-text-link">Create Account</a>
                </p>

            </form>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>

</html>
